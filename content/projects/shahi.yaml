title: Shahi
credit: ''
description: 'The Cultural Formation and Transformation: Shahi Art and Architecture from Afghanistan to the West Tibetan Frontier at the Dawn of the Islamic Era project (FWF, P-31246) considers for the first time the Shahi kingdoms (c. 7th-10th centuries) which played a pivotal role in the history of Central, Inner, and South Asia. Our ongoing research on the primary source material--artifacts, coins, inscriptions, archaeological evidence--suggests that the Hindu-Buddhist culture survived through the end of the first millennium and gradually evolved towards an Islamic culture at the start of the second millennium. '
