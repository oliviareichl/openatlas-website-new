title: Epigraphies Of Pious Travel
description: The Epigraphies of Pious Travel project (FWF project I 5286-G25) collates and contextualises graffiti written by pilgrims in the eastern Mediterranean during the Byzantine period, c. 300 – 1500 CE. Through collaboration with OpenAtlas, the project will produce a digital corpus of material in the Greek language. Not reliant on a wealthy patron, graffiti written by pilgrims provides an insight into Byzantine religious ritual and the experiences of a larger cross-section of the population.
