title: DANCEM
description: The Late antique cemeteries on the Danube project focuses on bringing together and analysing both published and self-compiled archaeological and anthropological data from late antique cemeteries on the Danube Limes and its hinterland between Passau and Budapest to gain deeper insights into the lives and deaths of the people.
