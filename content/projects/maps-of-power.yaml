title: Maps Of Power
credit: CC-BY-SA 4.0, Jan Belik
description: 'The Maps of Power project is a research initiative that serves the methodological and interdisciplinary networking of scholars from the field of Historical Geography. It focuses on Historical Ecology, Sacred Topography and Cultural Heritage and sees itself as a scholarly platform that implements its own projects based on OpenAtlas as well as networks in an interdisciplinary fashion through joint projects. '
