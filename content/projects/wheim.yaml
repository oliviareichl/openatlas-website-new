title: WHEIM
credit: CC-BY-SA 4.0, Renate Bornberg
description: The World Heritage Elements Inventory Mapping project collects, analyses, and locates key attributes of World Heritage Sites, focusing on the Hallstatt–Dachstein/ Salzkammergut Cultural Landscape. This mapping improves safeguarding and monitoring of the region and can also be adopted by other World Heritage Sites.
