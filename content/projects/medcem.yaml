description: The Medieval Cemeteries at the Periphery of the Carolingian World project deals with the digital collection and presentation of medieval cemeteries and it is based at the Archaeological Institute of the Czech Academy of Sciences in Prague. All published information is provided online and can be explored via a digital catalogue and within an interactive map. Cartographic visualisations as well as charts and plots are created dynamically based on real archaeological research data.
