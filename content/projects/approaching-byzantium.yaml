title: Approaching Byzantium
description: 'The Approaching Byzantium in Ottoman Istanbul: the Reception of the Byzantine Heritage of Constantinople by Scholars from the Holy Roman Empire in the 16th century project analyzes how visiting the city of Constantinople affected the reception of Byzantium by humanists from the Holy Roman Empire in the 16th century, when the former Byzantine capital was the seat of the Ottoman Empire.'
