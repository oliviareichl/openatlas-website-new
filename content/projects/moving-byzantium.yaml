title: Moving Byzantium
credit: CC-BY-SA 4.0, Johannes Preiser-Kapeller
description: 'The Moving Byzantium project highlights the role of Byzantium as a global culture and analyses the internal flexibility of Byzantine society. Its main focus is to contribute to a re-evaluation of a society and culture that has traditionally been depicted as stiff, rigid and encumbered by its own tradition. '
