title: biTEM
credit: CC-BY-SA 4.0, Jan Belik
description: The Beyond the Item project - short for Beyond the Item - Biographies and Itineraries of Cultural Heritage Objects in Museums and beyond - aims to present well-known museum objects in a state-of-the-art web application that is freely accessible online. The objects and their biographies are vividly described and, in addition to images and texts, 3D models as digital twins, timelines, and story maps are made available.
